services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bug_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    environment:
      BUG_AGENT_DATABASE_HOST: postgres
      BUG_AGENT_DATABASE_PORT: "5432"
      BUG_AGENT_DATABASE_USER: postgres
      BUG_AGENT_DATABASE_PASSWORD: postgres
      BUG_AGENT_DATABASE_DBNAME: bug_agent
      BUG_AGENT_REDIS_HOST: redis
      BUG_AGENT_REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 每次容器启动先执行幂等迁移，避免空数据库导致业务接口返回 500。
    command:
      - /bin/sh
      - -c
      - |
        python -m alembic upgrade head
        exec uvicorn app.main:app --host 0.0.0.0 --port 8765
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1/ || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
