api: CreateAnonymousSession
cases:
  - id: create_anonymous_session_success
    name: 创建匿名会话
    tags: [identity, post]
    request:
      params:
        consent_policy_version: "{{consent_policy_version}}"
    assert:
      http_status: 200
      gateway:
        code: 0
        message: ok
      response:
        id: req_0
        success: true
        code: 0
        message: ok
      data_fields:
        - access_token
        - expires_time
        - is_new_user
        - refresh_expires_time
        - refresh_token
        - user_id
    extract:
      access_token: $.access_token
      expires_time: $.expires_time
      refresh_token: $.refresh_token
      refresh_expires_time: $.refresh_expires_time
      user_id: $.user_id
