name: 生成 Reply 后重复并变更人物关联
variables: {}
runtime_inputs:
  person_id:
    label: 首个人物 ID
    description: 当前账号已有的 Dating person_id；请在执行前替换示例值
    type: string
    required: true
    target:
      scope: flow_step_request
      step_id: associate_person
      path: $.person_id
  repeat_person_id:
    label: 重复人物 ID
    description: 应与首个人物 ID 一致，用于验证幂等更新
    type: string
    required: true
    target:
      scope: flow_step_request
      step_id: repeat_same_association
      path: $.person_id
  alternate_person_id:
    label: 变更后人物 ID
    description: 当前账号另一个 Dating person_id，用于验证关联变更
    type: string
    required: true
    target:
      scope: flow_step_request
      step_id: change_association
      path: $.person_id
step_data:
  get_preferences:
    params: {}
    assert: {http_status: 200, gateway: {message: ok}}
  update_preferences:
    params:
      dating_goal: relationship
      your_voice: warm
      expected_version: "{{preferences_version}}"
    assert: {http_status: 200, gateway: {message: ok}}
  get_upload_config:
    params: {}
    assert: {http_status: 200, gateway: {message: ok}}
  prepare_upload:
    params:
      content_type: "{{media_file.content_type}}"
      size_bytes: "{{media_file.size_bytes}}"
      purpose: chat_screenshot
    assert: {http_status: 200, gateway: {message: ok}}
  complete_upload:
    params: {asset_id: "{{asset_id}}"}
    assert: {http_status: 200, gateway: {message: ok}}
  create_reply:
    params:
      asset_ids: "{{asset_ids}}"
      requested_intent: charming
      background: Reply association contract.
      locale: en-US
    assert: {http_status: 200, gateway: {message: ok}}
  poll_reply:
    params: {task_id: "{{reply_task_id}}"}
    assert: {http_status: 200, gateway: {message: ok}}
  get_reply_result:
    params: {task_id: "{{reply_task_id}}"}
    assert: {http_status: 200, gateway: {message: ok}}
  associate_person:
    params:
      task_id: "{{reply_task_id}}"
      person_id: dating_person_replace_before_run_a
    assert: {http_status: 200, gateway: {message: ok}}
  repeat_same_association:
    params:
      task_id: "{{reply_task_id}}"
      person_id: dating_person_replace_before_run_a
    assert: {http_status: 200, gateway: {message: ok}}
  change_association:
    params:
      task_id: "{{reply_task_id}}"
      person_id: dating_person_replace_before_run_b
    assert: {http_status: 200, gateway: {message: ok}}
