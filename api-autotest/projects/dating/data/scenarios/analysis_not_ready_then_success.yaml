name: 立即读取返回 TASK_NOT_READY，随后轮询并获取结果
variables:
  media_file: fixtures/chat-sample.png
step_data:
  get_upload_config:
    params: {}
    assert: {http_status: 200, gateway: {message: ok}}
  prepare_upload:
    params:
      content_type: image/png
      size_bytes: "{{media_size_bytes}}"
      purpose: chat_screenshot
    assert: {http_status: 200, gateway: {message: ok}}
  complete_upload:
    params: {asset_id: "{{asset_id}}"}
    assert: {http_status: 200, gateway: {message: ok}}
  create_analysis:
    params:
      asset_ids: ["{{asset_id}}"]
      locale: en-US
    assert: {http_status: 200, gateway: {message: ok}}
  get_result_before_ready:
    params: {task_id: "{{task_id}}"}
    assert:
      http_status: 200
      gateway: {message: ok}
      response: {id: req_0, success: false, business_error_code: TASK_NOT_READY}
  poll_analysis:
    params: {task_id: "{{task_id}}"}
    assert: {http_status: 200, gateway: {message: ok}}
  get_result_after_success:
    params: {task_id: "{{task_id}}"}
    assert: {http_status: 200, gateway: {message: ok}}
