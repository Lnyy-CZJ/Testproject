name: Dating 多图上传并重复完成最后一张图片
variables: {}
step_data:
  get_upload_config:
    params: {}
    assert:
      http_status: 200
      gateway: {message: ok}
  prepare_upload:
    params:
      content_type: "{{media_file.content_type}}"
      size_bytes: "{{media_file.size_bytes}}"
      purpose: chat_screenshot
    assert:
      http_status: 200
      gateway: {message: ok}
  complete_upload:
    params:
      asset_id: "{{asset_id}}"
    assert:
      http_status: 200
      gateway: {message: ok}
  repeat_last_complete:
    params:
      asset_id: "{{asset_id}}"
    assert:
      http_status: 200
      gateway: {message: ok}
