name: Dating Reply 幂等、替换与恢复契约
tags: [dating, reply, media, stateful, isolated, interactive, explicit]
inputs:
  media_files:
    type: files
    required: true
    min_items: 1
    max_items: 9
    allowed_content_types: [image/jpeg, image/png, image/webp]
    max_size_bytes: 7000000
    label: Reply 幂等图片
    description: 选择 1～9 张图片验证同任务复用、旧任务替换和新任务恢复
steps:
  - id: create_session
    api: CreateAnonymousSession
    extract:
      access_token: $.access_token
      expires_time: $.expires_time
      refresh_token: $.refresh_token
      refresh_expires_time: $.refresh_expires_time
      user_id: $.user_id
  - id: get_preferences
    api: GetUserPreferences
    extract: {preferences_version: $.version}
  - id: update_preferences
    api: UpdateUserPreferences
  - id: get_upload_config
    api: GetMediaUploadConfig
    extract:
      upload_allowed_content_types: $.allowed_content_types
      upload_min_asset_count: $.min_asset_count
      upload_max_asset_count: $.max_asset_count
      upload_max_size_bytes: $.max_size_bytes
  - id: validate_media_files
    action:
      type: validate_binary_inputs
      files: "{{media_files}}"
      allowed_content_types: "{{upload_allowed_content_types}}"
      min_items: "{{upload_min_asset_count}}"
      max_items: "{{upload_max_asset_count}}"
      max_size_bytes: "{{upload_max_size_bytes}}"
  - id: upload_media_files
    foreach:
      items: "{{media_files}}"
      item: media_file
      collect: {asset_ids: "{{asset_id}}"}
      steps:
        - id: prepare_upload
          api: PrepareMediaUpload
          extract:
            asset_id: $.asset_id
            upload_url: $.upload_url
            required_headers: $.required_headers
        - id: upload_binary
          action:
            type: signed_binary_upload
            url: "{{upload_url}}"
            headers: "{{required_headers}}"
            input_file: "{{media_file.relative_path}}"
            method: PUT
            success_statuses: [200, 204]
        - id: complete_upload
          api: CompleteMediaUpload
  - id: create_reply_first
    api: CreateReplyTask
    extract: {reply_task_a: $.task_id}
  - id: create_reply_retry
    api: CreateReplyTask
  - id: create_reply_replacement
    api: CreateReplyTask
    extract: {reply_task_b: $.task_id}
  - id: poll_superseded_reply
    api: GetReplyTask
    until:
      path: $.status
      equals: failed
      interval_seconds: "{{analysis_poll_interval_seconds}}"
      timeout_seconds: "{{analysis_timeout_seconds}}"
  - id: poll_replacement_reply
    api: GetReplyTask
    until:
      path: $.status
      equals: succeeded
      terminate_on: [rejected, failed]
      fail_on_termination: true
      interval_seconds: "{{analysis_poll_interval_seconds}}"
      timeout_seconds: "{{analysis_timeout_seconds}}"
  - id: get_replacement_result
    api: GetReplyResult
