[project]
name = "bug-agent-py"
version = "0.1.0"
description = "BugAgent Python 重构版 — AI 驱动的智能缺陷管理平台"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    # Web 框架
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # 数据库
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # 数据校验
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # 认证
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # 缓存
    "redis[hiredis]>=5.0.0",

    # 任务队列
    "celery[redis]>=5.3.0",

    # Git 操作
    "gitpython>=3.1.0",

    # SSE 实时推送
    "sse-starlette>=2.0.0",

    # HTTP 客户端
    "httpx>=0.27.0",

    # 加密
    "cryptography>=42.0.0",

    # 工具
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

agent = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"