[project]
name = "api-test-agent"
version = "0.1.0"
description = "独立的 API 测试契约、用例、Review 与受控执行项目。"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<3.2",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["agents*", "services*"]
exclude = ["executor*", "output*", "runtime*"]
