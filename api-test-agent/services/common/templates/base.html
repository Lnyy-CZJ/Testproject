<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ settings.base_path }}/static/agent-workbench.css">
  {% block styles %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" data-base-path="{{ settings.base_path }}" data-csrf="{{ csrf_token }}">
  <header class="topbar">
    <div class="platform-brand">
      <a class="platform-link" href="{{ platform_home_url }}">测试开发平台</a>
      <span aria-hidden="true">/</span>
      <a class="agent-link" href="{{ settings.base_path }}/">API 测试智能体</a>
    </div>
    <span class="environment-badge">AI 测试 · {{ settings.runtime_environment|upper }}</span>
  </header>
  <div class="app-shell">
    <aside class="workspace-sidebar" aria-label="API 测试智能体导航">{% block sidebar %}{% endblock %}</aside>
    <main class="workspace">{% block content %}{% endblock %}</main>
  </div>
  <script src="{{ settings.base_path }}/static/agent-workbench.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
