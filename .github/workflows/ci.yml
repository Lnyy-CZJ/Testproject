name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            test-platform/backend/requirements.txt
            functional-test-agent/requirements.lock
            api-test-agent/requirements-agent.lock
      - name: Platform backend tests
        run: |
          python -m pip install -r test-platform/backend/requirements.txt
          (cd test-platform/backend && python -m pytest)
      - name: Functional agent tests
        run: |
          python -m pip install -r functional-test-agent/requirements.lock
          (cd functional-test-agent && python -m pytest && node --test tests/ui/*.test.mjs)
      - name: API agent tests
        run: |
          python -m pip install -r api-test-agent/requirements-agent.lock
          (cd api-test-agent && python -m pytest)
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: test-platform/frontend/package-lock.json
      - name: Platform frontend tests and build
        run: |
          cd test-platform/frontend
          npm ci
          npm test
          npm run build

  production-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate image-only production Compose
        run: |
          cd test-platform
          docker compose --env-file .env.prod.example -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          ! docker compose --env-file .env.prod.example -f docker-compose.yml -f docker-compose.prod.yml config | grep -qE '^[[:space:]]+build:'

  docker-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: test-platform
            dockerfile: test-platform/Dockerfile
          - context: test-platform/backend
            dockerfile: test-platform/backend/Dockerfile
          - context: TrackEvents_tess
            dockerfile: TrackEvents_tess/Dockerfile
          - context: log_filter_tool
            dockerfile: log_filter_tool/Dockerfile
          - context: Truthy_Search
            dockerfile: Truthy_Search/Dockerfile
          - context: Truthy_ApiAutoTest2
            dockerfile: Truthy_ApiAutoTest2/Dockerfile
          - context: functional-test-agent
            dockerfile: functional-test-agent/Dockerfile
          - context: api-test-agent
            dockerfile: api-test-agent/Dockerfile.agent
          - context: api-test-agent
            dockerfile: api-test-agent/Dockerfile.controller
          - context: api-test-agent
            dockerfile: api-test-agent/Dockerfile.egress
          - context: api-test-agent
            dockerfile: api-test-agent/Dockerfile.executor
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
