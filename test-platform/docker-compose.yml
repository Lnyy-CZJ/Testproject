services:
  platform-gateway:
    build:
      context: .
    ports:
      - "${PLATFORM_PORT:-8080}:80"
    depends_on:
      - trackevents-web
      - log-filter-tool
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  platform-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-test_platform}"
      POSTGRES_USER: "${POSTGRES_USER:-platform}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-platform_dev_password}"
    volumes:
      - platform-db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-test_platform}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  platform-migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform_dev_password}@platform-db:5432/${POSTGRES_DB:-test_platform}"
      APP_ENV: "${APP_ENV:-development}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      TOOL_HEALTH_TIMEOUT_SECONDS: "${TOOL_HEALTH_TIMEOUT_SECONDS:-3}"
    depends_on:
      platform-db:
        condition: service_healthy
    restart: "no"

  platform-api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform_dev_password}@platform-db:5432/${POSTGRES_DB:-test_platform}"
      APP_ENV: "${APP_ENV:-development}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      TOOL_HEALTH_TIMEOUT_SECONDS: "${TOOL_HEALTH_TIMEOUT_SECONDS:-3}"
    expose:
      - "8000"
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  trackevents-web:
    build:
      context: ../TrackEvents_tess
    environment:
      TRACKEVENTS_HOST: 0.0.0.0
      TRACKEVENTS_PORT: 8000
      TRACKEVENTS_BASE_PATH: /trackevents
      PLATFORM_HOME_URL: /
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/trackevents/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  log-filter-tool:
    build:
      context: ../log_filter_tool
    environment:
      LOG_FILTER_BASE_PATH: /log-filter
      # 将导出文件保存到宿主机固定目录，避免容器重建后临时文件丢失。
      LOG_EXPORT_DIR: /exports
      LOG_EXPORT_DISPLAY_DIR: /Users/admin/Documents/log
      PLATFORM_HOME_URL: /
    volumes:
      # 页面提示使用宿主机路径，容器实际写入对应的 /exports 目录。
      - /Users/admin/Documents/log:/exports
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/log-filter/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  platform-db-data:
    name: platform-db-data
