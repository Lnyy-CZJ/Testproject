worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format platform '$remote_addr - $request_method $request_uri $status $request_time';
    access_log /var/log/nginx/access.log platform;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 25m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;

        auth_request_set $platform_user_id $upstream_http_x_platform_user_id;
        auth_request_set $platform_username $upstream_http_x_platform_username;
        auth_request_set $platform_display_name $upstream_http_x_platform_display_name;
        auth_request_set $platform_permissions $upstream_http_x_platform_permissions;
        auth_request_set $platform_user_context $upstream_http_x_platform_user_context;
        auth_request_set $platform_resource_context $upstream_http_x_platform_resource_context;

        # 版本互查仅返回非敏感运行身份，并由独立 Bearer Token 保护。
        location = /api/v1/internal/version-snapshot {
            set $platform_api_upstream platform-api:8000;
            proxy_pass http://$platform_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
            add_header Cache-Control "no-store" always;
        }

        # 其余内部接口不对浏览器公开；工具容器通过内部网络直连 API。
        location ^~ /api/v1/internal/ {
            return 404;
        }

        location = /__platform_authorize {
            internal;
            set $platform_api_upstream platform-api:8000;
            proxy_pass http://$platform_api_upstream/api/v1/internal/authorize;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Tool-ID $platform_tool_id;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            # 浏览器提供的同名 Header 不得进入签发端；可信值只能来自授权响应。
            proxy_set_header X-Platform-User-Context "";
            proxy_set_header X-Platform-Resource-Context "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        location @platform_unauthorized {
            default_type application/json;
            add_header X-Request-ID "nginx_$request_id" always;
            if ($request_uri ~ "/api(?:/|$)") {
                return 401 '{"code":"AUTH_REQUIRED","message":"请先登录","request_id":"nginx_$request_id"}';
            }
            return 302 /login;
        }

        location @platform_forbidden {
            default_type application/json;
            add_header X-Request-ID "nginx_$request_id" always;
            if ($request_uri ~ "/api(?:/|$)") {
                return 403 '{"code":"PERMISSION_DENIED","message":"无权执行此操作","request_id":"nginx_$request_id"}';
            }
            return 302 /403;
        }

        # 注意:该分支同时承接 auth_request 授权子请求失败与各工具上游返回的 500
        # (nginx 的 auth_request 机制下两者无法区分),因此文案不得指认具体故障源。
        location @platform_auth_unavailable {
            default_type application/json;
            add_header X-Request-ID "nginx_$request_id" always;
            return 503 '{"code":"SERVICE_UNAVAILABLE","message":"服务暂时不可用,请稍后重试","request_id":"nginx_$request_id"}';
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 使用 Docker DNS 动态解析 API，API 未启动时网关仍能提供首页和工具入口。
        location /api/v1/ {
            set $platform_api_upstream platform-api:8000;
            proxy_pass http://$platform_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # 注册限流只信任网关覆盖后的单值来源；客户端传入的代理链和设备
            # 信号都在此处清除，API 以固定标记区分可信网关请求。
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Test-Platform-Gateway "1";
            proxy_set_header X-Registration-Device "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        location = /trackevents {
            return 308 /trackevents/;
        }

        location /trackevents/ {
            set $platform_tool_id trackevents;
            auth_request /__platform_authorize;
            error_page 401 = @platform_unauthorized;
            error_page 403 = @platform_forbidden;
            error_page 500 = @platform_auth_unavailable;
            set $trackevents_upstream trackevents-web:8000;
            proxy_pass http://$trackevents_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /trackevents;
            proxy_set_header X-Platform-User-ID $platform_user_id;
            proxy_set_header X-Platform-Username $platform_username;
            proxy_set_header X-Platform-Display-Name $platform_display_name;
            proxy_set_header X-Platform-Permissions $platform_permissions;
            proxy_set_header X-Platform-User-Context $platform_user_context;
            proxy_set_header X-Platform-Resource-Context $platform_resource_context;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_intercept_errors on;
            error_page 502 503 504 /tool-unavailable.html;
        }

        location = /log-filter {
            return 308 /log-filter/;
        }

        location /log-filter/ {
            set $platform_tool_id log-filter;
            auth_request /__platform_authorize;
            error_page 401 = @platform_unauthorized;
            error_page 403 = @platform_forbidden;
            error_page 500 = @platform_auth_unavailable;
            set $log_filter_upstream log-filter-tool:5001;
            proxy_pass http://$log_filter_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /log-filter;
            proxy_set_header X-Platform-User-ID $platform_user_id;
            proxy_set_header X-Platform-Username $platform_username;
            proxy_set_header X-Platform-Display-Name $platform_display_name;
            proxy_set_header X-Platform-Permissions $platform_permissions;
            proxy_set_header X-Platform-User-Context $platform_user_context;
            proxy_set_header X-Platform-Resource-Context $platform_resource_context;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_intercept_errors on;
            error_page 502 503 504 /tool-unavailable.html;
        }

        location = /truthy-search {
            return 308 /truthy-search/;
        }

        location /truthy-search/ {
            set $platform_tool_id truthy-search;
            auth_request /__platform_authorize;
            error_page 401 = @platform_unauthorized;
            error_page 403 = @platform_forbidden;
            error_page 500 = @platform_auth_unavailable;
            set $truthy_search_upstream truthy-search:5002;
            proxy_pass http://$truthy_search_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /truthy-search;
            proxy_set_header X-Platform-User-ID $platform_user_id;
            proxy_set_header X-Platform-Username $platform_username;
            proxy_set_header X-Platform-Display-Name $platform_display_name;
            proxy_set_header X-Platform-Permissions $platform_permissions;
            proxy_set_header X-Platform-User-Context $platform_user_context;
            proxy_set_header X-Platform-Resource-Context $platform_resource_context;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_intercept_errors on;
            error_page 502 503 504 /tool-unavailable.html;
        }

        location = /api-autotest {
            return 308 /api-autotest/;
        }

        location /api-autotest/ {
            set $platform_tool_id api-autotest;
            auth_request /__platform_authorize;
            error_page 401 = @platform_unauthorized;
            error_page 403 = @platform_forbidden;
            error_page 500 = @platform_auth_unavailable;
            set $api_autotest_upstream api-autotest:5003;
            proxy_pass http://$api_autotest_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api-autotest;
            proxy_set_header X-Platform-User-ID $platform_user_id;
            proxy_set_header X-Platform-Username $platform_username;
            proxy_set_header X-Platform-Display-Name $platform_display_name;
            proxy_set_header X-Platform-Permissions $platform_permissions;
            proxy_set_header X-Platform-User-Context $platform_user_context;
            proxy_set_header X-Platform-Resource-Context $platform_resource_context;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_intercept_errors on;
            error_page 502 503 504 /tool-unavailable.html;
        }

        location = /functional-test-agent {
            return 308 /functional-test-agent/;
        }

        location /functional-test-agent/ {
            # 在线用例 Review 正文最多 10 MiB，额外 1 MiB 留给 JSON 协议开销。
            client_max_body_size 11m;
            set $platform_tool_id functional-test-agent;
            auth_request /__platform_authorize;
            error_page 401 = @platform_unauthorized;
            error_page 403 = @platform_forbidden;
            error_page 500 = @platform_auth_unavailable;
            set $functional_agent_upstream functional-test-agent:5004;
            proxy_pass http://$functional_agent_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /functional-test-agent;
            # 浏览器伪造值全部被授权子请求结果覆盖。
            proxy_set_header X-Platform-User-ID $platform_user_id;
            proxy_set_header X-Platform-Username $platform_username;
            proxy_set_header X-Platform-Display-Name $platform_display_name;
            proxy_set_header X-Platform-Permissions $platform_permissions;
            proxy_set_header X-Platform-User-Context $platform_user_context;
            proxy_set_header X-Platform-Resource-Context $platform_resource_context;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_intercept_errors on;
            error_page 502 503 504 /tool-unavailable.html;
        }

        location = /api-test-agent {
            return 308 /api-test-agent/;
        }

        location /api-test-agent/ {
            client_max_body_size 6m;
            set $platform_tool_id api-test-agent;
            auth_request /__platform_authorize;
            error_page 401 = @platform_unauthorized;
            error_page 403 = @platform_forbidden;
            error_page 500 = @platform_auth_unavailable;
            set $api_agent_upstream api-test-agent:5005;
            proxy_pass http://$api_agent_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api-test-agent;
            proxy_set_header X-Platform-User-ID $platform_user_id;
            proxy_set_header X-Platform-Username $platform_username;
            proxy_set_header X-Platform-Display-Name $platform_display_name;
            proxy_set_header X-Platform-Permissions $platform_permissions;
            proxy_set_header X-Platform-User-Context $platform_user_context;
            proxy_set_header X-Platform-Resource-Context $platform_resource_context;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_intercept_errors on;
            error_page 502 503 504 /tool-unavailable.html;
        }

        location = /tool-unavailable.html {
            internal;
            alias /etc/nginx/errors/tool-unavailable.html;
            expires -1;
        }

        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
