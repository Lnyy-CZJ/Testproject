worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    log_format platform '$remote_addr - $request_method $request_uri $status $request_time';
    access_log /var/log/nginx/access.log platform;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 25m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;

        location = / {
            try_files /index.html =404;
            expires -1;
        }

        location = /styles.css {
            try_files /styles.css =404;
            expires 5m;
        }

        location = /app.js {
            try_files /app.js =404;
            expires 5m;
        }

        location = /trackevents {
            return 308 /trackevents/;
        }

        location /trackevents/ {
            proxy_pass http://trackevents-web:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /trackevents;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_intercept_errors on;
            error_page 502 503 504 /tool-unavailable.html;
        }

        location = /log-filter {
            return 308 /log-filter/;
        }

        location /log-filter/ {
            proxy_pass http://log-filter-tool:5001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /log-filter;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_intercept_errors on;
            error_page 502 503 504 /tool-unavailable.html;
        }

        location = /tool-unavailable.html {
            internal;
            alias /etc/nginx/errors/tool-unavailable.html;
            expires -1;
        }

        location / {
            return 404;
        }
    }
}
