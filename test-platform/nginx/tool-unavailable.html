<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>工具暂时不可用</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #17211b; background: #f2f4ed; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(520px, calc(100% - 40px)); padding: 38px; border: 1px solid #d7ddd4; border-radius: 16px; background: #fbfcf8; }
      p { color: #5e6a63; line-height: 1.7; }
      a { display: inline-block; margin-right: 12px; padding: 9px 14px; border-radius: 7px; color: #fff; background: #176b4d; text-decoration: none; }
      button { padding: 8px 13px; border: 1px solid #d7ddd4; border-radius: 7px; background: transparent; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>工具暂时不可用</h1>
      <p>服务可能正在启动或维护。平台和其他工具不受影响，请稍后重试。</p>
      <a href="/">返回平台首页</a>
      <button type="button" onclick="window.location.reload()">重新加载</button>
    </main>
  </body>
</html>
