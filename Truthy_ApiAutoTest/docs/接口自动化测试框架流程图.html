  &lt;section class=&quot;flow-section&quot; id=&quot;current-flow&quot;&gt;
    &lt;h2&gt;流程 01：当前框架如何协作&lt;/h2&gt;
    &lt;p class=&quot;section-intro&quot;&gt;当前代码能运行，但主要通过 Python Service 和 Python 测试代码串联，新增接口通常需要继续写代码。&lt;/p&gt;
    &lt;div class=&quot;mermaid&quot;&gt;
flowchart TB
    A[&quot;runtest.py&lt;br/&gt;环境 / suite / marker / 报告参数&quot;] --&gt; B[&quot;Pytest&lt;br/&gt;tests/contract 与 tests/unit&quot;]
    B --&gt; C[&quot;tests/conftest.py&lt;br/&gt;Settings / GatewayClient / Session fixture&quot;]
    C --&gt; D[&quot;services/*.py&lt;br/&gt;Identity / Subscription / Search / Media 等&quot;]

    D --&gt; G[&quot;COS PUT Client&lt;br/&gt;预签名上传&quot;]

    N[&quot;测试数据多为 Python 内联&quot;] --&gt; B
    &lt;/div&gt;
    &lt;div class=&quot;notes&quot;&gt;

          &lt;li&gt;统一 Gateway HTTP 入口与安全策略&lt;/li&gt;
          &lt;li&gt;双层断言、异步等待、脱敏和报告&lt;/li&gt;
          &lt;li&gt;Identity、Subscription、Search 等业务封装&lt;/li&gt;

  &lt;section class=&quot;flow-section&quot; id=&quot;gap-analysis&quot;&gt;
    &lt;h2&gt;流程 02：当前问题与改造方向&lt;/h2&gt;
    &lt;p class=&quot;section-intro&quot;&gt;你的判断成立：当前版本更像“针对现有业务用例实现的自动化工程”，还不是“只配接口和数据就能扩展”的通用框架。&lt;/p&gt;
    &lt;div class=&quot;gap-list&quot; role=&quot;list&quot; aria-label=&quot;现状与目标对照&quot;&gt;
      &lt;div class=&quot;gap-row&quot; role=&quot;listitem&quot;&gt;
        &lt;strong&gt;接口管理&lt;/strong&gt;
        &lt;span&gt;现在：Service 类中硬编码 service_name、method_name 和参数&lt;/span&gt;
        &lt;div&gt;目标：&lt;code&gt;apis/*.yaml&lt;/code&gt; 统一注册，按接口名称查找和执行&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;gap-row&quot; role=&quot;listitem&quot;&gt;
        &lt;strong&gt;接口数据&lt;/strong&gt;
        &lt;span&gt;现在：参数主要写在测试函数、fixture 或 mock 响应中&lt;/span&gt;
        &lt;div&gt;目标：&lt;code&gt;data/payloads&lt;/code&gt; 管理请求模板，支持变量引用&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;gap-row&quot; role=&quot;listitem&quot;&gt;
        &lt;strong&gt;用例数据&lt;/strong&gt;
        &lt;span&gt;现在：Loader 已存在，但多数 contract 用例仍是 Python 内联&lt;/span&gt;
        &lt;div&gt;目标：&lt;code&gt;data/cases&lt;/code&gt; 作为数据唯一入口，Python 只保留行为&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;gap-row&quot; role=&quot;listitem&quot;&gt;
        &lt;strong&gt;工具代码&lt;/strong&gt;
        &lt;span&gt;现在：按 assertions/client/reporting/security 等目录分散&lt;/span&gt;
        &lt;div&gt;目标：统一聚合到 &lt;code&gt;core&lt;/code&gt;，内部仍按职责分包，避免扁平 utils&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;gap-row&quot; role=&quot;listitem&quot;&gt;
        &lt;strong&gt;用例管理&lt;/strong&gt;
        &lt;span&gt;现在：新增接口通常要新增 Service 方法和 test_*.py&lt;/span&gt;
        &lt;div&gt;目标：普通接口只新增 API YAML + Case YAML；复杂流程才写 Python 插件&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;flow-section&quot; id=&quot;target-architecture&quot;&gt;
    &lt;h2&gt;流程 03：目标通用架构&lt;/h2&gt;
    &lt;p class=&quot;section-intro&quot;&gt;采用“双轨制”：80% 普通接口由配置驱动，上传、轮询、条件分支等复杂场景由流程插件扩展。&lt;/p&gt;
    &lt;div class=&quot;mermaid&quot;&gt;
flowchart TB
    U[&quot;测试工程师&quot;] --&gt; API[&quot;接口注册层&lt;br/&gt;apis/*.yaml&quot;]
    U --&gt; DATA[&quot;统一数据层&lt;br/&gt;data/payloads + data/cases + data/flows&quot;]
    API --&gt; REG[&quot;ApiRegistry&lt;br/&gt;读取、校验、缓存接口定义&quot;]
    DATA --&gt; CASE[&quot;CaseLoader&lt;br/&gt;参数化、变量替换、Schema 校验&quot;]
    REG --&gt; EXE[&quot;ApiExecutor&lt;br/&gt;execute(api_name, data, context)&quot;]
    CASE --&gt; EXE
    EXE --&gt; TRANSPORT{&quot;Transport&quot;}
    TRANSPORT --&gt; GW[&quot;GatewayTransport&quot;]
    TRANSPORT --&gt; REST[&quot;RestTransport&quot;]
    TRANSPORT --&gt; COS[&quot;CosPutTransport&quot;]
    GW --&gt; TOOL[&quot;core 工具层&lt;br/&gt;Session / Log / Redactor / Assertion / Report&quot;]
    REST --&gt; TOOL
    COS --&gt; TOOL
    CASE --&gt; FLOW{&quot;流程复杂度&quot;}
    FLOW --&gt;|&quot;标准提取与断言&quot;| YAML[&quot;YAML Flow Runner&quot;]
    FLOW --&gt;|&quot;上传 / 轮询 / 条件分支&quot;| PY[&quot;Python Flow Plugin&quot;]
    YAML --&gt; EXE
    PY --&gt; EXE
    TOOL --&gt; OUT[&quot;Allure + JUnit + Jenkins + 飞书&quot;]
    &lt;/div&gt;
    &lt;div class=&quot;legend&quot; aria-label=&quot;架构原则&quot;&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;配置驱动：普通接口&lt;/span&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;插件扩展：复杂流程&lt;/span&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;安全门禁：执行层统一控制&lt;/span&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;flow-section&quot; id=&quot;directory-plan&quot;&gt;
    &lt;h2&gt;流程 04：推荐目录与职责&lt;/h2&gt;
    &lt;p class=&quot;section-intro&quot;&gt;接口、数据、工具和用例各有唯一入口；Jenkinsfile 仍保留在根目录，这是 Jenkins 的标准约定。&lt;/p&gt;
    &lt;div class=&quot;tree-grid&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;目标目录&lt;/h3&gt;
        &lt;pre&gt;&lt;code&gt;Truthy_ApiAutoTest/
├── apis/                    # 接口管理
│   ├── identity.yaml
│   ├── subscription.yaml
│   ├── search.yaml
│   └── media.yaml
├── data/                    # 所有可变测试数据
│   ├── environments/
│   ├── payloads/            # 请求体模板
│   ├── cases/               # 单接口用例数据
│   ├── flows/               # 多接口步骤数据
│   ├── schemas/             # 数据结构校验
│   └── public_samples/      # 脱敏公开样例
├── core/                    # 框架工具代码
│   ├── http/                # Gateway/REST/COS
│   ├── config/              # 配置加载
│   ├── logging/             # 日志与脱敏
│   ├── assertions/          # 通用断言
│   ├── reporting/           # Allure/JUnit
│   ├── notification/        # 飞书
│   └── execution/           # Registry/Executor/Context
├── flows/                   # 复杂 Python 流程插件
├── tests/
│   ├── test_api_cases.py    # 通用单接口驱动
│   ├── test_flow_cases.py   # 通用流程驱动
│   ├── contract/
│   └── unit/
├── runtest.py               # 唯一执行入口
└── Jenkinsfile              # CI 标准入口&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;每层只负责一件事&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;&lt;code&gt;apis&lt;/code&gt;：这个接口怎么请求、需要什么鉴权&lt;/li&gt;
          &lt;li&gt;&lt;code&gt;data&lt;/code&gt;：本次用什么输入、期望什么结果&lt;/li&gt;
          &lt;li&gt;&lt;code&gt;core&lt;/code&gt;：怎么安全发送、记录、断言和报告&lt;/li&gt;
          &lt;li&gt;&lt;code&gt;flows&lt;/code&gt;：多个接口如何传值、轮询和分支&lt;/li&gt;
          &lt;li&gt;&lt;code&gt;tests&lt;/code&gt;：选择哪些数据集并交给执行器&lt;/li&gt;
          &lt;li&gt;&lt;code&gt;runtest.py&lt;/code&gt;：决定环境、范围和安全级别&lt;/li&gt;
          &lt;li&gt;&lt;code&gt;Jenkinsfile&lt;/code&gt;：决定什么时候运行以及是否阻断&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;flow-section&quot; id=&quot;new-api-flow&quot;&gt;
    &lt;h2&gt;流程 05：以后新增接口和用例怎么做&lt;/h2&gt;
    &lt;p class=&quot;section-intro&quot;&gt;普通接口不再要求新增 Service 类；只有框架不能表达的特殊协议或流程才补 Python。&lt;/p&gt;
    &lt;div class=&quot;mermaid&quot;&gt;
flowchart TB
    A[&quot;新增 apis/业务域.yaml&lt;br/&gt;声明名称、transport、path/service、method、auth&quot;] --&gt; B[&quot;新增 data/payloads/请求模板.yaml&quot;]
    B --&gt; C[&quot;新增 data/cases/业务域/TC-xxx.yaml&lt;br/&gt;输入、期望、marker&quot;]
    C --&gt; D{&quot;是否为普通单接口?&quot;}
    D --&gt;|是| E[&quot;test_api_cases.py 自动收集&quot;]
    D --&gt;|否| F{&quot;能否用 YAML 步骤表达?&quot;}
    F --&gt;|是| G[&quot;data/flows/*.yaml&lt;br/&gt;call / extract / assert / wait&quot;]
    F --&gt;|否| H[&quot;flows/*.py&lt;br/&gt;编写上传、轮询或条件插件&quot;]
    G --&gt; I[&quot;test_flow_cases.py 自动收集&quot;]
    H --&gt; I
    E --&gt; J[&quot;runtest.py --suite contract/smoke/regression&quot;]
    I --&gt; J
    J --&gt; K[&quot;Allure / JUnit / Jenkins / 飞书&quot;]
    &lt;/div&gt;
    &lt;div class=&quot;notes&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;普通新增&lt;/h3&gt;
        &lt;ol&gt;
          &lt;li&gt;注册接口 YAML&lt;/li&gt;
          &lt;li&gt;准备请求模板&lt;/li&gt;
          &lt;li&gt;增加 Case YAML&lt;/li&gt;
          &lt;li&gt;运行统一测试入口&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;需要写 Python 的情况&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;COS 二进制上传&lt;/li&gt;
          &lt;li&gt;异步任务轮询与非法状态倒退&lt;/li&gt;
          &lt;li&gt;复杂条件分支和跨域一致性校验&lt;/li&gt;
          &lt;li&gt;外部夹具、数据库只读核验等适配器&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;flow-section&quot; id=&quot;runtime-flow&quot;&gt;
    &lt;h2&gt;流程 06：单条配置化用例执行流程&lt;/h2&gt;
    &lt;p class=&quot;section-intro&quot;&gt;用例只引用接口名称，不直接拼 URL、信封、请求头或报告附件。&lt;/p&gt;
    &lt;div class=&quot;mermaid&quot;&gt;
sequenceDiagram
    participant T as 通用 Pytest Driver
    participant C as CaseLoader
    participant R as ApiRegistry
    participant E as ApiExecutor
    participant H as HTTP Transport
    participant A as Assertion/Report
    T-&gt;&gt;C: 读取 TC-xxx.yaml
    C--&gt;&gt;T: 输入、期望、marker、变量引用
    T-&gt;&gt;R: get(identity.create_anonymous_session)
    R--&gt;&gt;T: 接口定义与安全级别
    T-&gt;&gt;E: execute(api, case_data, CaseContext)
    E-&gt;&gt;E: 模板渲染 + 鉴权 + 幂等 ID
    E-&gt;&gt;H: Gateway / REST / COS 请求
    H--&gt;&gt;E: 标准化 Response
    E-&gt;&gt;A: 双层断言 + Schema + 脱敏附件
    A--&gt;&gt;T: 用例结果与提取变量
    T-&gt;&gt;C: 将动态值写入内存 Context
    Note over T,C: token、task_id 等不回写 YAML，也不跨用例共享

  &lt;section class=&quot;flow-section&quot; id=&quot;ci-flow&quot;&gt;
    &lt;h2&gt;流程 07：Jenkins 日常接口检查&lt;/h2&gt;

  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js&quot;&gt;&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;api-framework-visual&#x27;);
      root.querySelectorAll(&#x27;[data-target]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const target = document.getElementById(button.dataset.target);
          if (target) target.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; });
        });
      });

      const resolvedColor = (name, fallback) =&gt; {
        const probe = document.createElement(&#x27;span&#x27;);
        probe.style.color = `var(${name})`;
        probe.style.position = &#x27;absolute&#x27;;
        probe.style.visibility = &#x27;hidden&#x27;;
        root.appendChild(probe);
        const color = getComputedStyle(probe).color;
        probe.remove();
        if (!color) return fallback;
        const canvas = document.createElement(&#x27;canvas&#x27;);
        canvas.width = 1;
        canvas.height = 1;
        const context = canvas.getContext(&#x27;2d&#x27;);
        if (!context) return fallback;
        context.clearRect(0, 0, 1, 1);
        context.fillStyle = color;
        context.fillRect(0, 0, 1, 1);
        const [red, green, blue, alpha] = context.getImageData(0, 0, 1, 1).data;
        if (alpha &lt; 255) return `rgba(${red}, ${green}, ${blue}, ${(alpha / 255).toFixed(3)})`;
        return `rgb(${red}, ${green}, ${blue})`;
      };
      mermaid.initialize({
        startOnLoad: true,
        securityLevel: &#x27;strict&#x27;,
        theme: &#x27;base&#x27;,
        flowchart: { useMaxWidth: true, htmlLabels: true, curve: &#x27;basis&#x27; },
        sequence: { useMaxWidth: true, wrap: true },
        themeVariables: {
          background: resolvedColor(&#x27;--background&#x27;, &#x27;#ffffff&#x27;),
          primaryColor: resolvedColor(&#x27;--card&#x27;, &#x27;#f6f6f6&#x27;),
          primaryTextColor: resolvedColor(&#x27;--card-foreground&#x27;, &#x27;#202020&#x27;),
          primaryBorderColor: resolvedColor(&#x27;--border&#x27;, &#x27;#a0a0a0&#x27;),
          lineColor: resolvedColor(&#x27;--muted-foreground&#x27;, &#x27;#666666&#x27;),
          secondaryColor: resolvedColor(&#x27;--muted&#x27;, &#x27;#eeeeee&#x27;),
          tertiaryColor: resolvedColor(&#x27;--background&#x27;, &#x27;#ffffff&#x27;),
          clusterBkg: resolvedColor(&#x27;--card&#x27;, &#x27;#f6f6f6&#x27;),
          clusterBorder: resolvedColor(&#x27;--border&#x27;, &#x27;#a0a0a0&#x27;),
          noteBkgColor: resolvedColor(&#x27;--muted&#x27;, &#x27;#eeeeee&#x27;),
          noteTextColor: resolvedColor(&#x27;--foreground&#x27;, &#x27;#202020&#x27;),
          fontFamily: &#x27;system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif&#x27;
        }
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
