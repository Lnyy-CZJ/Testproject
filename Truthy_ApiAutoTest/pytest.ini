[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    contract: 离线或真实环境的接口契约测试
    live_safe: 仅在显式 --run-live-safe 时执行的安全只读联调
    p0: 阻断级核心用例
    p1: 重要但非阻断级用例
    smoke: 冒烟用例
    auth: 身份、会话与鉴权用例
    subscription: 订阅商品、订单、状态和权益用例
    billing: 底层订单能力用例，正常订阅流程不得混用
    media: 媒体上传配置、COS PUT 和完成确认用例
    report: 报告补图和报告级反馈用例
    feedback: 报告或个人中心反馈用例
    entitlement_fixture: 短期权益夹具适配器用例
    fixture_required: 依赖受控外部测试夹具的用例，缺协议或凭据时明确跳过
    search: 搜索创建、任务状态、候选和历史用例
    async_task: 异步任务轮询、状态机和超时预算用例
    requires_entitlement: 依赖有效搜索权益的用例，缺少权益时应明确跳过
    idempotency: 幂等键或重复请求语义用例
    live_write: 会对真实环境产生写入的用例，必须同时标记 destructive
    payment_sandbox: 依赖商店或支付沙箱的用例
    compatibility: 仅手工执行的兼容性扩展用例
    payment_real: 真实支付用例，默认排除
    destructive: 具有破坏性或不可逆副作用的用例，默认排除
