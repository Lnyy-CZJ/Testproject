# logindata.yaml
# 公共参数
case_common:
  login_URL: "http://shop-xo.hctestedu.com/index.php?s=/api/user/login"
  headers:
    "application": "web"
    "application_client_type": "PC"

login_cases:
  - case_id: login_001
    description: 登录成功
    requestdata:
      type: username
      accounts: czj11
      pwd: czj111
    assertion:
      status_code: 1
      prompt_msg: 登录成功

  - case_id: login_002
    description: 密码错误
    requestdata:
      type: username
      accounts: czj11
      pwd: czj1112
    assertion:
      status_code: -4
      prompt_msg: 密码错误

  - case_id: login_003
    description: 登录帐号不存在
    requestdata:
      type: username
      accounts: czj112
      pwd: czj111
    assertion:
      status_code: -3
      prompt_msg: 登录帐号不存在

  - case_id: login_004
    description: 登录账号为空
    requestdata:
      type: username
      accounts: ""
      pwd: czj111
    assertion:
      status_code: -1
      prompt_msg: 登录账号不能为空

  - case_id: login_005
    description: 登录密码为空
    requestdata:
      type: username
      accounts: czj11
      pwd: ""
    assertion:
      status_code: -1
      prompt_msg: 密码格式 6~18 个字符之间

  - case_id: login_006
    description: 登录账号密码为空
    requestdata:
      type: username
      accounts: ""
      pwd: ""
    assertion:
      status_code: -1
      prompt_msg: 登录账号不能为空

  - case_id: login_007
    description: 登录帐号有中文字符
    requestdata:
      type: username
      accounts: czj111我
      pwd: czj111
    assertion:
      status_code: -3
      prompt_msg: 登录帐号不存在

  - case_id: login_008
    description: 登录密码有中文字符
    requestdata:
      type: username
      accounts: czj11
      pwd: czj111我
    assertion:
      status_code: -4
      prompt_msg: 密码错误