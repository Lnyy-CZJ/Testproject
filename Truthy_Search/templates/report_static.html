<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ report.metadata.evaluation_name }} · {{ report.metadata.report_id }}</title>
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17212b; background: #f5f7f8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; }
    main { max-width: 1180px; margin: 0 auto; }
    h1 { font-size: 36px; margin: 6px 0; }
    h2 { margin: 0 0 14px; }
    h3 { margin-top: 26px; }
    p, li { line-height: 1.6; }
    .report-section { background: #fff; border: 1px solid #dce3e7; border-radius: 16px; padding: 24px; margin-bottom: 18px; }
    .page-heading, .section-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; }
    .eyebrow { margin: 0; color: #0c776d; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .status { display: inline-block; border-radius: 999px; padding: 7px 11px; background: #e6f4f1; font-weight: 700; }
    .metric-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .metric-strip > div { background: #f4f7f7; border-radius: 12px; padding: 16px; }
    .metric-strip span, .metric-strip small { display: block; color: #65737e; }
    .metric-strip strong { display: block; margin: 8px 0; font-size: 22px; }
    .data-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .data-list div { background: #f4f7f7; border-radius: 10px; padding: 12px; }
    dt { color: #65737e; font-size: 12px; } dd { margin: 5px 0 0; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #e2e7ea; text-align: left; vertical-align: top; }
    th { background: #eef3f3; font-size: 12px; }
    small { display: block; color: #65737e; margin-top: 4px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    details { border-top: 1px solid #e2e7ea; padding: 12px 0; }
    summary { cursor: pointer; font-weight: 700; }
    .report-warnings { border-color: #e5c76b; background: #fffaf0; }
    .compare-v6-hero { display: grid; grid-template-columns: 1fr minmax(460px, .9fr); gap: 28px; align-items: center; padding: 28px; border: 1px solid #cce3de; border-radius: 16px; background: linear-gradient(135deg, #edf8f5, #fff 64%); margin-bottom: 18px; }
    .compare-v6-hero h1 { margin: 7px 0; } .compare-v6-hero p:last-child { color: #65737e; }
    .compare-v6-route { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
    .compare-v6-route > div { display: grid; gap: 5px; min-width: 0; padding: 14px; border: 1px solid #d8e6e2; border-radius: 11px; background: #fff; }
    .compare-v6-route small, .compare-v6-route span { color: #65737e; font-size: 11px; overflow-wrap: anywhere; } .compare-v6-route b { color: #0c776d; font-size: 20px; }
    .compare-v6-facts, .compare-v6-status-line { display: flex; flex-wrap: wrap; gap: 9px; }
    .compare-v6-facts span, .compare-v6-status-line span { padding: 8px 11px; border-radius: 8px; background: #eef5f3; color: #65737e; font-size: 12px; }
    .compare-v6-facts strong { color: #17212b; font-size: 16px; }
    .compare-v6-status-line { margin-bottom: 14px; }
    .compare-v6-table td { vertical-align: middle; } .compare-v6-table td:first-child { min-width: 170px; }
    .compare-v6-delta { display: inline-block; padding: 5px 8px; border-radius: 7px; background: #eef2f1; color: #65737e; font-size: 12px; font-weight: 800; }
    .compare-v6-delta.improved { background: #ddf4e8; color: #11633e; } .compare-v6-delta.regressed { background: #f8e7e5; color: #9a3737; }
    .compare-v6-migration { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .compare-v6-migration > div { padding: 16px; border: 1px solid #dce3e7; border-radius: 12px; background: #f7faf9; }
    .compare-v6-migration span { display: block; color: #65737e; font-size: 12px; } .compare-v6-migration strong { display: block; margin-top: 7px; font-size: 28px; }
    .compare-v6-appendix { overflow: hidden; margin-top: 10px; border: 1px solid #dce3e7; border-radius: 12px; background: #fff; }
    .compare-v6-appendix > summary { display: flex; justify-content: space-between; padding: 15px 17px; list-style: none; }
    .compare-v6-appendix > summary span { color: #65737e; font-size: 12px; } .compare-v6-appendix .table-wrap { border-top: 1px solid #dce3e7; }
    .report-v5-hero { display: flex; justify-content: space-between; gap: 24px; padding: 26px; border: 1px solid #cce3de; border-radius: 16px; background: linear-gradient(135deg, #edf8f5, #fff 62%); margin-bottom: 18px; }
    .report-v5-hero-meta { display: grid; align-content: start; gap: 8px; min-width: 190px; color: #0c776d; }
    .report-v5-subtitle { margin-bottom: 0; color: #65737e; }
    .report-v5-alert { display: flex; gap: 10px; margin-bottom: 18px; padding: 14px 18px; border: 1px solid #e8ba82; border-radius: 12px; background: #fff7ec; color: #80500c; }
    .report-v5-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .report-v5-kpi { padding: 16px; border: 1px solid #dce3e7; border-radius: 12px; background: #f6faf9; }
    .report-v5-kpi span, .report-v5-kpi small { display: block; color: #65737e; }
    .report-v5-kpi .report-v5-kpi-label { color: #17212b; font-size: 14px; font-weight: 800; }
    .report-v5-kpi .report-v5-kpi-purpose { min-height: 34px; margin-top: 6px; line-height: 1.45; }
    .report-v5-kpi strong { display: block; margin: 8px 0; font-size: 27px; }
    .report-v5-kpi-explanation { margin-top: 12px; padding-top: 12px; border-top: 1px solid #dce3e7; font-size: 12px; }
    .report-v5-scope-summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    .report-v5-scope-summary span { padding: 7px 10px; border-radius: 999px; background: #eef5f3; color: #65737e; font-size: 12px; }
    .report-v5-scope-modules { display: grid; gap: 10px; margin-top: 16px; }
    .report-v5-scope-modules > details { padding: 12px 14px; border: 1px solid #dce3e7; border-radius: 10px; }
    .report-v5-scope-modules > details > summary { display: flex; justify-content: space-between; gap: 16px; }
    .report-v5-confidence-bars { display: grid; gap: 10px; margin: 18px 0; }
    .report-v5-confidence-bars > div { display: grid; grid-template-columns: 90px 1fr 110px; align-items: center; gap: 12px; }
    .report-v5-confidence-bars > div > div { height: 10px; overflow: hidden; border-radius: 99px; background: #e8efed; }
    .report-v5-confidence-bars i { display: block; height: 100%; border-radius: inherit; background: #0c776d; }
    .report-v5-confidence-bars strong { font-size: 12px; text-align: right; }
    .report-v5-facts { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 16px; color: #65737e; font-size: 13px; }
    .report-v5-facts strong { color: #17212b; }
    .report-v5-static-list { display: grid; gap: 16px; }
    .report-v5-static-query { padding: 16px; border: 1px solid #dce3e7; border-radius: 12px; background: #fbfdfd; }
    .report-v5-static-query > summary { display: flex; justify-content: space-between; gap: 16px; }
    .report-v5-static-query h3 { margin: 0; }
    .report-v5-static-query h4 { margin-bottom: 8px; }
    .report-v5-static-value { max-width: 320px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .report-v5-static-drilldown { margin-top: 10px; }
    .report-v5-diagnostic-list { display: grid; gap: 8px; padding: 0; list-style: none; }
    .report-v5-diagnostic-list li { display: grid; grid-template-columns: minmax(170px, .5fr) 2fr; gap: 12px; padding: 10px; border-radius: 8px; background: #fff8ed; }
    @media (max-width: 800px) { body { padding: 12px; } .metric-strip, .data-list, .report-v5-kpis { grid-template-columns: 1fr 1fr; } .report-v5-hero { flex-direction: column; } .compare-v6-hero { grid-template-columns: 1fr; } .compare-v6-route { grid-template-columns: 1fr; } .compare-v6-migration { grid-template-columns: 1fr 1fr; } .report-v5-diagnostic-list li { grid-template-columns: 1fr; } }
    @media print { body { padding: 0; background: #fff; } .report-section, .report-v5-static-query { break-inside: avoid; box-shadow: none; } details { break-inside: avoid; } }
  </style>
</head>
<body>
  <main>
    {% include "_report_content.html" %}
  </main>
</body>
</html>
