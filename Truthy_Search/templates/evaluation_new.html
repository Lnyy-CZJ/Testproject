{% extends "base.html" %}
{% block title %}创建评测 · Truthy Search{% endblock %}
{% block content %}
  <div class="page-heading">
    <div>
      <p class="eyebrow">New Evaluation</p>
      <h1>创建评测</h1>
      <p>Evaluation 用来归集同一测试目标下的多个系统版本 Run。</p>
    </div>
  </div>

  {% if errors %}
    <div class="error-list">
      {% for error in errors %}<p>{{ error }}</p>{% endfor %}
    </div>
  {% endif %}

  <form class="form-panel narrow" method="post">
    <label>
      <span>evaluation_id</span>
      <input name="evaluation_id" required maxlength="128"
             value="{{ form.evaluation_id if form else '' }}"
             placeholder="例如 eval_20260723">
      <small>只使用字母、数字、点、下划线和连字符。</small>
    </label>
    <label>
      <span>评测名称</span>
      <input name="name" required maxlength="200"
             value="{{ form.name if form else '' }}"
             placeholder="例如 7月常态化检索评测">
    </label>
    <label>
      <span>说明</span>
      <textarea name="notes" rows="5" placeholder="数据范围、测试目标或版本说明">{{ form.notes if form else '' }}</textarea>
    </label>
    <label>
      <span>参考线方案（可选）</span>
      <select name="threshold_profile_id">
        <option value="">暂不选择</option>
        {% for profile in threshold_profiles %}
          <option value="{{ profile.profile_id }}" {% if form and form.threshold_profile_id == profile.profile_id %}selected{% endif %}>{{ profile.name }} v{{ profile.version }} · FULL_NAME {{ profile.configured_counts.FULL_NAME }} 项 / FULL_NAME_SOCIAL {{ profile.configured_counts.FULL_NAME_SOCIAL }} 项 / FULL_NAME_PHOTO {{ profile.configured_counts.FULL_NAME_PHOTO }} 项 / FULL_NAME_SOCIAL_PHOTO {{ profile.configured_counts.FULL_NAME_SOCIAL_PHOTO }} 项</option>
        {% endfor %}
      </select>
      <small>方案内容会复制为 Evaluation 快照；未选择不影响执行和报告生成。</small>
    </label>
    <p class="inline-note"><a href="{{ url_for('threshold_profiles') }}">前往参考线方案管理</a></p>
    <div class="form-actions">
      <button class="button primary" type="submit">创建评测</button>
      <a class="button text" href="{{ url_for('index') }}">取消</a>
    </div>
  </form>
{% endblock %}
