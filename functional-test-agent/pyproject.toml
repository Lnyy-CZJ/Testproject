[project]
name = "functional-test-agent"
version = "0.1.0"
description = "独立的功能测试用例生成与 Review 智能体。"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<3.2",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["agents*", "requirement_decomposition*", "services*"]
exclude = ["output*", "runtime*"]
