project:
  project_id: "PROJECT-001"
  project_name: "个人中心系统"
  version: "1.0.0"

sources:
  - source_id: "SRC-001"
    source_type: "markdown"
    path: "PRD/documents/个人中心需求文档.md"
    trust_level: "high"

llm:
  enabled: true
  model: "gpt-4.1"
  temperature: 0.1
  max_tokens: 4096
  prompt_version: "v1.0"
  verbose: true
  self_check_enabled: false

output:
  requirement_json:
    enabled: true
    path: "output/requirements/requirements.json"
  markdown:
    enabled: true
    path: "output/requirements/requirements_md"
  test_seed:
    enabled: true
    path: "output/requirements/test_seed.json"
    include_confirmed_candidate: true

quality_gate:
  min_quality_score: 0.9
  require_source_trace: true
  require_field_evidence: true
  require_test_objects: true
  require_constraints: true
  require_gwt: true
  require_schema_valid: true
  require_grounding_check_passed: true
  max_unsupported_facts: 0
