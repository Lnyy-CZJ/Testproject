name: 搜索流程
tags: [flow, media, search]
steps:
  - id: create_task
    api: CreateIntentTask
    extract:
      task_id: $.task_id

  - id: poll_task
    api: GetTask
    until:
      path: $.status
      equals: SUCCEEDED
      interval_seconds: 2
      timeout_seconds: 120

  - id: list_candidates
    api: ListTaskCandidates
    extract:
      candidate_id: $.items[0].candidate_id

  - id: candidate_detail
    api: GetTaskCandidateDetail
