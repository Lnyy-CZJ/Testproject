name: 刷新匿名会话 Token
tags: [identity, post]
flow_only: true
request:
  service_name: tool.identity.IdentityService
  method_name: RefreshSession
  params:
    refresh_token: "{{refresh_token}}"
assert:
  http_status: 200
  gateway:
    code: 0
    message: ok
  response:
    id: req_0
    success: true
    code: 0
    message: ok
  data_fields:
    - access_token
    - expires_time
    - refresh_expires_time
    - refresh_token
    - user_id
extract:
  access_token: $.access_token
  expires_time: $.expires_time
  refresh_token: $.refresh_token
  refresh_expires_time: $.refresh_expires_time
  user_id: $.user_id
