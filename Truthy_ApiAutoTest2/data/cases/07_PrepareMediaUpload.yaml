name: 准备媒体上传
tags: [media, post]
flow_only: true
request:
  service_name: tool.people_insight.MediaService
  method_name: PrepareMediaUpload
  params:
    client_request_id: "{{client_request_id}}"
    content_type: image/jpeg
    size_bytes: "{{media_size_bytes}}"
assert:
  http_status: 200
  gateway:
    code: 0
    message: ok
  response:
    id: req_0
    success: true
    code: 0
    message: ok
  data_fields:
    - content_type
    - expires_time
    - max_size_bytes
    - media_asset_id
    - size_bytes
    - status
    - upload_headers
    - upload_method
    - upload_url
extract:
  upload_url: $.upload_url
  upload_headers: $.upload_headers
  media_asset_id: $.media_asset_id
