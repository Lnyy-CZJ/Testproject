name: 创建并启动线索搜索任务
tags: [search, post]
flow_only: true
request:
  service_name: tool.people_insight.SearchService
  method_name: CreateIntentTask
  params:
    client_request_id: "{{client_request_id}}"
    match_strategy: UNION
    clues:
      - type: FULL_NAME
        full_name_query:
          full_name: JOJO CCQQ MOCK
      - type: LOCATION
        location_query:
          location: us
      - type: SOCIAL_LINK
        social_link_query:
          url: "https://www.linkedin.com/search/results/people/?keywords=John%20Smith%20photographer"
          platform_hint: linkedin
      - type: SOCIAL_LINK
        social_link_query:
          url: https://x.com
          platform_hint: twitter
      - type: PHOTO
        photo_query:
          media_asset_id: "{{media_asset_id}}"
          photo_type_hint: face
    additional_details:
      - type: PROFESSION
        value: aa
      - type: EMPLOYER
        value: bb
      - type: SCHOOL
        value: cc
      - type: OTHER
        value: dd
assert:
  http_status: 200
  gateway:
    code: 0
    message: ok
  response:
    id: req_0
    success: true
    code: 0
    message: ok
  data_fields:
    - accepted_query_type
    - additional_details
    - cache_hit
    - can_start_real_search
    - clue_types
    - entitlement_decision
    - expires_time
    - match_strategy
    - status
    - task_id
extract:
  task_id: $.task_id
