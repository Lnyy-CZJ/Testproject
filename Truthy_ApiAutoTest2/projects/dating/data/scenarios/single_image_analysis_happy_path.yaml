name: Dating 单图关系分析并清理私密数据
variables:
  media_file: fixtures/chat-sample.png
step_data:
  get_upload_config:
    params: {}
    assert:
      http_status: 200
      gateway: {code: 0}
      response: {id: req_0, success: true, code: 0}
      data_fields: [config_version, allowed_content_types, min_asset_count, max_asset_count, max_size_bytes]
  prepare_upload:
    params:
      client_request_id: "{{client_request_id}}"
      content_type: image/png
      size_bytes: "{{media_size_bytes}}"
    assert:
      http_status: 200
      gateway: {code: 0}
      response: {id: req_0, success: true, code: 0}
      data_fields: [asset_id, status, upload_url, upload_method, required_headers]
  complete_upload:
    params:
      asset_id: "{{asset_id}}"
    assert:
      http_status: 200
      gateway: {code: 0}
      response: {id: req_0, success: true, code: 0}
      data_fields: [asset_id, status, uploaded_time]
      data_equals: {status: uploaded}
  create_analysis:
    params:
      client_request_id: "{{client_request_id}}"
      asset_ids: ["{{asset_id}}"]
      locale: en-US
    assert:
      http_status: 200
      gateway: {code: 0}
      response: {id: req_0, success: true, code: 0}
      data_fields: [task_id, task_type, status, phase, create_time, expire_time]
      data_equals: {status: queued}
  poll_analysis:
    params:
      task_id: "{{task_id}}"
    assert:
      http_status: 200
      gateway: {code: 0}
      response: {id: req_0, success: true, code: 0}
      data_fields: [task_id, task_type, status, phase, retryable, create_time, expire_time]
  get_analysis_result:
    params:
      task_id: "{{task_id}}"
    assert:
      http_status: 200
      gateway: {code: 0}
      response: {id: req_0, success: true, code: 0}
      data_fields: [task_id, task_type, result_id, schema_version, result, create_time, expire_time]
      data_equals: {schema_version: dating.relationship_analysis.v1}
      data_types:
        result: object
        result.overview: object
        result.overview.next_steps: array
        result.overview.dashboard: object
        result.chat_signals: object
        result.chat_signals.positive: array
        result.chat_signals.watch: array
        result.chat_signals.risk: array
        result.key_events: object
        result.key_events.turning_points: array
        result.key_events.hidden_meanings: array
        result.key_events.did_well: array
        result.key_events.could_improve: array
  delete_task_data:
    params:
      task_id: "{{task_id}}"
    assert:
      http_status: 200
      gateway: {code: 0}
      response: {id: req_0, success: true, code: 0}
      data_fields: [task_id, logical_deleted, object_deletion_status, delete_time]
      data_equals: {logical_deleted: true}
  verify_deleted_task:
    params:
      task_id: "{{task_id}}"
    assert:
      http_status: 200
      gateway: {code: 0}
      response: {id: req_0, success: false, business_error_code: NOT_FOUND}
  verify_deleted_result:
    params:
      task_id: "{{task_id}}"
    assert:
      http_status: 200
      gateway: {code: 0}
      response: {id: req_0, success: false, business_error_code: NOT_FOUND}
