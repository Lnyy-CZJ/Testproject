name: 擦除隔离账号 Dating 数据、幂等重试并重新建立偏好
variables: {}
step_data:
  create_session:
    params: {consent_policy_version: "{{consent_policy_version}}"}
    assert: {http_status: 200, gateway: {message: ok}}
  get_preferences_before:
    params: {}
    assert: {http_status: 200, gateway: {message: ok}}
  seed_preferences:
    params:
      client_request_id: "{{flow_run_id}}-seed-preferences"
      dating_goal: serious_relationship
      your_voice: warm_direct
      expected_version: "{{preferences_version_before}}"
    assert: {http_status: 200, gateway: {message: ok}}
  delete_user_data:
    params: {client_request_id: "{{flow_run_id}}-delete-user-data"}
    assert: {http_status: 200, gateway: {message: ok}}
  repeat_delete_user_data:
    params: {client_request_id: "{{flow_run_id}}-delete-user-data"}
    assert:
      http_status: 200
      gateway: {message: ok}
      data_equals: {deletion_id: "{{deletion_id}}"}
  verify_account_still_available:
    params: {}
    assert: {http_status: 200, gateway: {message: ok}}
  get_preferences_after:
    params: {}
    assert: {http_status: 200, gateway: {message: ok}}
  recreate_preferences:
    params:
      client_request_id: "{{flow_run_id}}-recreate-preferences"
      dating_goal: serious_relationship
      your_voice: warm_direct
      expected_version: "{{preferences_version_after}}"
    assert: {http_status: 200, gateway: {message: ok}}
