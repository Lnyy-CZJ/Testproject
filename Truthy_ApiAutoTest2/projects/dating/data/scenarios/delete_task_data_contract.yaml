name: Dating Analysis 任务删除、幂等重试与不可读验证
variables:
  media_file: fixtures/chat-sample.png
step_data:
  get_upload_config:
    params: {}
    assert:
      http_status: 200
      gateway: {message: ok}
  prepare_upload:
    params:
      client_request_id: "{{flow_run_id}}-prepare-delete-contract"
      content_type: image/png
      size_bytes: "{{media_size_bytes}}"
      purpose: chat_screenshot
    assert:
      http_status: 200
      gateway: {message: ok}
  complete_upload:
    params:
      asset_id: "{{asset_id}}"
    assert:
      http_status: 200
      gateway: {message: ok}
  create_analysis:
    params:
      client_request_id: "{{flow_run_id}}-analysis-delete-contract"
      asset_ids: ["{{asset_id}}"]
      locale: en-US
    assert:
      http_status: 200
      gateway: {message: ok}
  poll_analysis:
    params:
      task_id: "{{task_id}}"
    assert:
      http_status: 200
      gateway: {message: ok}
  get_analysis_result:
    params:
      task_id: "{{task_id}}"
    assert:
      http_status: 200
      gateway: {message: ok}
  delete_task_data:
    params:
      task_id: "{{task_id}}"
    assert:
      http_status: 200
      gateway: {message: ok}
  repeat_delete_task_data:
    params:
      task_id: "{{task_id}}"
    assert:
      http_status: 200
      gateway: {message: ok}
  verify_deleted_task:
    params:
      task_id: "{{task_id}}"
    assert:
      http_status: 200
      gateway: {message: ok}
      response: {id: req_0, success: false, business_error_code: NOT_FOUND}
  verify_deleted_result:
    params:
      task_id: "{{task_id}}"
    assert:
      http_status: 200
      gateway: {message: ok}
      response: {id: req_0, success: false, business_error_code: NOT_FOUND}
