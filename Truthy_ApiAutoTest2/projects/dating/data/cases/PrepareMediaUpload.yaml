api: PrepareMediaUpload
cases:
  - id: prepare_jpeg_success
    name: 准备 JPEG 聊天截图上传
    tags: [dating, media, boundary]
    request:
      params:
        client_request_id: "{{client_request_id}}"
        content_type: image/jpeg
        size_bytes: 1024
        purpose: chat_screenshot
    assert:
      http_status: 200
      gateway: {message: ok}
  - id: prepare_png_success
    name: 准备 PNG 聊天截图上传
    tags: [dating, media, boundary]
    request:
      params:
        client_request_id: "{{client_request_id}}"
        content_type: image/png
        size_bytes: 1024
        purpose: chat_screenshot
    assert:
      http_status: 200
      gateway: {message: ok}
  - id: prepare_webp_success
    name: 准备 WebP 聊天截图上传
    tags: [dating, media, boundary]
    request:
      params:
        client_request_id: "{{client_request_id}}"
        content_type: image/webp
        size_bytes: 1024
        purpose: chat_screenshot
    assert:
      http_status: 200
      gateway: {message: ok}
  - id: prepare_size_at_limit_success
    name: 单图 7000000 字节边界允许上传
    tags: [dating, media, boundary]
    request:
      params:
        client_request_id: "{{client_request_id}}"
        content_type: image/png
        size_bytes: 7000000
        purpose: chat_screenshot
    assert:
      http_status: 200
      gateway: {message: ok}
  - id: prepare_size_over_limit
    name: 单图超过 7000000 字节被拒绝
    tags: [dating, media, negative, boundary]
    request:
      params:
        client_request_id: "{{client_request_id}}"
        content_type: image/png
        size_bytes: 7000001
        purpose: chat_screenshot
    assert:
      http_status: 200
      gateway: {message: ok}
      # 最新汇总协议尚未冻结具体校验错误码，只锁定业务子请求失败。
      response: {id: req_0, success: false}
  - id: prepare_unsupported_content_type
    name: 不支持的媒体类型被拒绝
    tags: [dating, media, negative, boundary]
    request:
      params:
        client_request_id: "{{client_request_id}}"
        content_type: image/gif
        size_bytes: 1024
        purpose: chat_screenshot
    assert:
      http_status: 200
      gateway: {message: ok}
      response: {id: req_0, success: false}
