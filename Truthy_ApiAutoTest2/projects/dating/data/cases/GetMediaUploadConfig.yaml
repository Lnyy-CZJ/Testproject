api: GetMediaUploadConfig
cases:
  - id: get_media_upload_config_success
    name: 获取 Dating 实时上传约束
    tags: [dating, smoke, media]
    request:
      params: {}
    assert:
      http_status: 200
      gateway: {code: 0}
      response: {id: req_0, success: true, code: 0}
      data_fields: [config_version, allowed_content_types, min_asset_count, max_asset_count, max_size_bytes, upload_url_ttl_seconds]
