name: Dating 单图 Analysis 成功链路
tags: [dating, smoke, regression, flow, analysis, media]
steps:
  - id: get_upload_config
    api: GetMediaUploadConfig
  - id: prepare_upload
    api: PrepareMediaUpload
    extract:
      asset_id: $.asset_id
      upload_url: $.upload_url
      upload_method: $.upload_method
      required_headers: $.required_headers
  - id: upload_binary
    action:
      type: signed_binary_upload
      url: "{{upload_url}}"
      headers: "{{required_headers}}"
      fixture: chat-sample.png
      method: PUT
      success_statuses: [200, 204]
  - id: complete_upload
    api: CompleteMediaUpload
  - id: create_analysis
    api: CreateAnalysisTask
    extract:
      task_id: $.task_id
  - id: poll_analysis
    api: GetAnalysisTask
    until:
      path: $.status
      equals: succeeded
      terminate_on: [rejected, failed]
      interval_seconds: "{{analysis_poll_interval_seconds}}"
      timeout_seconds: "{{analysis_timeout_seconds}}"
    extract:
      analysis_status: $.status
  - id: get_analysis_result
    api: GetAnalysisResult
    skip_unless:
      variable: analysis_status
      equals: succeeded
  - id: delete_task_data
    api: DeleteTaskData
    run_on_termination: true
  - id: verify_deleted_task
    api: GetAnalysisTask
  - id: verify_deleted_result
    api: GetAnalysisResult
